<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5C6BC0"/>
      <stop offset="1" stop-color="#283593"/>
    </linearGradient>
  </defs>

  <!-- 圆角底板 -->
  <rect x="8" y="8" width="496" height="496" rx="108" fill="url(#bg)"/>
  <rect x="10" y="10" width="492" height="492" rx="106" fill="none"
        stroke="#FFFFFF" stroke-opacity="0.12" stroke-width="2"/>

  <!-- 页面投影 -->
  <path d="M168 92 h146 l86 86 v266 a24 24 0 0 1 -24 24 h-232
           a24 24 0 0 1 -24 -24 v-328 a24 24 0 0 1 24 -24 z"
        transform="translate(0 10)" fill="#1A237E" opacity="0.28"/>

  <!-- 白色页面 -->
  <path d="M168 80 h146 l86 86 v266 a24 24 0 0 1 -24 24 h-232
           a24 24 0 0 1 -24 -24 v-328 a24 24 0 0 1 24 -24 z"
        fill="#FFFFFF"/>

  <!-- 右上折角 -->
  <path d="M314 80 v70 a16 16 0 0 0 16 16 h70 z" fill="#C5CAE9"/>

  <!-- 文本行 -->
  <rect x="184" y="208" width="176" height="16" rx="8" fill="#9FA8DA"/>
  <rect x="184" y="248" width="144" height="16" rx="8" fill="#9FA8DA"/>
  <rect x="184" y="288" width="160" height="16" rx="8" fill="#9FA8DA"/>

  <!-- PDF 标记 -->
  <rect x="176" y="336" width="192" height="72" rx="18" fill="#E53935"/>
  <text x="272" y="388" text-anchor="middle"
        font-family="DejaVu Sans, Noto Sans, sans-serif"
        font-size="44" font-weight="bold" letter-spacing="2"
        fill="#FFFFFF">PDF</text>
</svg>
